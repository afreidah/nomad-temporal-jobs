# -------------------------------------------------------------------------------
# Build and push the worker and website images on every merge to main, record
# their version and start the deployment.
#
# Project: Nomad Temporal Jobs / Author: Alex Freidah
#
# This file runs only on a Forgejo instance -- GitHub ignores .forgejo/workflows.
# Its presence is also what stops Forgejo from falling back to .github/workflows,
# which targets GitHub-hosted runners and fails on a self-hosted one.
#
# push-all builds every image, not just the domains a merge touched. The
# repository reaches Forgejo through a mirror whose pushes are force-updated and
# can batch several commits, so a push event's own commit range does not reliably
# describe what changed; and the workers share the root Dockerfile and the
# internal packages, so most changes are not confined to one domain anyway.
#
# It runs serially rather than through push-all-parallel: the runner is a 4 CPU /
# 4 GB allocation, and eight concurrent image builds do not fit in it.
# -------------------------------------------------------------------------------

name: Images

on:
  push:
    branches: [main]

jobs:
  images:
    name: Build and push images
    runs-on: build
    steps:
      # The Hugo theme lives in a git submodule. Without `submodules` the
      # checkout leaves web/themes/hugo-theme-relearn empty, Hugo happily builds
      # against an empty theme, and `make web-push` only fails once the site
      # reaches the first theme shortcode it cannot resolve.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every image tags from `git describe --tags`
          submodules: recursive

      # An empty theme is silent until Hugo renders, so check it here rather
      # than at the end of seven worker builds.
      - name: Verify theme submodule
        run: |
          set -euo pipefail
          if [ ! -f web/themes/hugo-theme-relearn/layouts/shortcodes/badge.html ]; then
            echo "web/themes/hugo-theme-relearn is not checked out" >&2
            exit 1
          fi

      # Every image is tagged with this one value, and it is the value recorded
      # below, so the deployment cannot name a tag that was not pushed.
      - name: Resolve the version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # The Go builds cross-compile, but the backup and trivy runtime stages
          # have RUN steps, so their arm64 leg needs an emulator the build host
          # does not carry.
          docker run --privileged --rm tonistiigi/binfmt --install all

          make push-all VERSION="$VERSION" WEB_TAG="$VERSION"

      # The deployment reads its version from this key, so it is written only
      # once the images above exist under that tag.
      - name: Record the released version
        env:
          CONSUL_HTTP_ADDR: http://127.0.0.1:8500
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          consul kv put deploy/versions/nomad-temporal-jobs "$VERSION"

          # Read back, so a silently-accepted write cannot pass as a success.
          got=$(consul kv get deploy/versions/nomad-temporal-jobs)
          [ "$got" = "$VERSION" ] || {
            echo "::error::readback mismatch: stored $got, expected $VERSION"
            exit 1
          }
          echo "recorded ${got}"

      - name: Start the deployment
        env:
          RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: token ${RELEASE_DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"app":"nomad-temporal-jobs"}}' \
            http://forgejo.service.consul:30028/api/v1/repos/alex/munchbox/actions/workflows/deploy-version.yml/dispatches
