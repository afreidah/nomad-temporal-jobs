baseURL = "https://nomad-temporal-jobs.munchbox.cc/"
languageCode = "en-us"
title = "nomad-temporal-jobs"
theme = "hugo-theme-relearn"

[params]
  themeVariant = ["temporal-workers"]
  description = "Temporal workflows that run the recurring work a Nomad, Consul and Vault cluster needs: Raft snapshots, image scanning, storage reclamation, certificate and token renewal, and on-demand CI runners."
  # Social card. The OpenGraph and Twitter partials switch to the large-image
  # card once a page resolves an image; without one, a link shared to Slack,
  # Reddit, or X renders as bare text.
  images = ["images/logo.png"]
  # Cloudflare Web Analytics site token, emitted as the RUM beacon by
  # partials/custom-footer.html. Public by design: it names the site rather than
  # authenticating, and ships in the page source on every request. This is the
  # munchbox.cc zone's token, shared by every site on the zone.
  webAnalyticsToken = "77f2d4d9a4724baeb678a41619d533c5"
  # Address pages by their directory rather than ".../index.html". The theme
  # appends that suffix so a build still works opened from disk; served over
  # HTTP it disagrees with the canonical tag every page carries.
  disableExplicitIndexURLs = true
  showVisitedLinks = false
  disableLandingPageButton = false
  alwaysopen = true
  collapsibleMenu = true
  [params.search]
    disable = true
  [params.topbar]
    showTableOfContents = false
    showBreadcrumbs = false
    showEditLink = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../README.md"
    target = "assets/repo/README.md"
  [[module.mounts]]
    source = "../CHANGELOG.md"
    target = "assets/repo/CHANGELOG.md"
